[build-system]
requires = ["scikit-build-core>=0.5", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "yadnp3"
version = "3.1.2.1"
description = "Python bindings for yadnp3 -- Yet Another opendnp3 fork (IEEE-1815 DNP3 protocol)"
readme = "../README.md"
license = "Apache-2.0"
requires-python = ">=3.9"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.scikit-build]
cmake.source-dir = ".."
cmake.args = ["-DDNP3_PYTHON=ON", "-DDNP3_STATIC_LIBS=ON", "-DDNP3_TESTS=OFF"]
install.components = ["python"]
wheel.packages = ["../opendnp3"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-win32 *-musllinux*"
test-command = 'python -c "import opendnp3; m = opendnp3.DNP3Manager(1); m.Shutdown(); print(\"yadnp3 OK\")"'

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
before-build = "yum install -y openssl-devel"

[tool.cibuildwheel.windows]
before-build = "choco install --no-progress openssl && pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"

[tool.pytest.ini_options]
testpaths = ["tests"]
