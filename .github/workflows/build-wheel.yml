name: Build and Release opendnp3 Python Wheel

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: 'Publish to PyPI'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v2
        with:
          package-dir: python
        env:
          CIBW_ENVIRONMENT: >-
            CMAKE_ARGS="-DDNP3_TLS=ON"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  test-wheels:
    name: Test wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: build-wheels
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./dist

      - name: Install and test (Linux)
        if: runner.os == 'Linux'
        run: |
          pip install ./dist/*cp$(echo "${{ matrix.python }}" | tr -d '.')*.whl
          cd /tmp
          python -c "import opendnp3; print('opendnp3 import OK')"
          python -c "import opendnp3; print(f'DNP3Manager: {opendnp3.DNP3Manager}')"
          python -c "import opendnp3; m = opendnp3.DNP3Manager(1); m.Shutdown(); print('Manager lifecycle OK')"
          python -c "
          import opendnp3
          for name in ['DNP3Manager', 'IChannel', 'IMaster', 'IOutstation',
                       'MasterStackConfig', 'OutstationStackConfig',
                       'Binary', 'Analog', 'Counter']:
              assert hasattr(opendnp3, name), f'Missing: {name}'
          print('All key types present')
          "

      - name: Install and test (Windows)
        if: runner.os == 'Windows'
        run: |
          $pyTag = "cp" + "${{ matrix.python }}".Replace(".", "")
          $wheel = Get-ChildItem "dist/*$pyTag*.whl" | Select-Object -First 1
          pip install $wheel.FullName

          Push-Location $env:TEMP
          python -c @'
          import opendnp3
          print(f'DNP3Manager: {opendnp3.DNP3Manager}')
          m = opendnp3.DNP3Manager(1)
          m.Shutdown()
          print('Manager lifecycle OK')
          for name in ['DNP3Manager', 'IChannel', 'IMaster', 'IOutstation',
                       'MasterStackConfig', 'OutstationStackConfig',
                       'Binary', 'Analog', 'Counter']:
              assert hasattr(opendnp3, name), f'Missing: {name}'
          print('All key types present')
          '@
          Pop-Location

  create-release:
    name: Create GitHub Release
    needs: [build-wheels, test-wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref_type == 'tag'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get package version
        id: get_version
        run: |
          PACKAGE_VERSION=$(python3 version.py)
          echo "package_version=${PACKAGE_VERSION}" >> $GITHUB_OUTPUT

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ steps.get_version.outputs.package_version }}
        run: |
          ls -la dist/
          gh release create "${{ github.ref_name }}" dist/*.whl \
            --title "opendnp3 v${PACKAGE_VERSION}" \
            --notes "$(cat <<EOF
          ## opendnp3 v${PACKAGE_VERSION}

          Python bindings for [opendnp3](https://github.com/f0rw4rd/opendnp3) -- IEEE-1815 (DNP3) protocol implementation.

          ### Supported Platforms
          - Linux x86_64 (manylinux_2_28, Python 3.9-3.13)
          - Windows x86_64 (Python 3.9-3.13)

          ### Installation

          From GitHub Release:
          \`\`\`bash
          pip install opendnp3 --find-links https://github.com/f0rw4rd/opendnp3/releases/download/${{ github.ref_name }}/
          \`\`\`
          EOF
          )"

  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheels, test-wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event.inputs.publish_pypi == 'true')

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: List wheels
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          skip-existing: true
